parameters:
  - name: environmentName
    type: string
  - name: useAlm4DataverseExtension
    type: boolean
    default: true
  - name: previousEnvironmentName
    type: string
    default: ''
  - name: continueDeployment
    type: boolean
    default: false
  - name: timeoutInMinutes
    type: number
    default: 360  # maximum allowed on Microsoft-hosted agents (free and paid)

# Stage identifiers cannot contain the same characters as environment display
# names. Keep the original name for approvals, service connections and variables.
stages:
  - stage: Deploy_${{ replace(replace(replace(replace(replace(replace(parameters.environmentName, ' ', '_'), '-', '_'), '.', '_'), '(', '_'), ')', '_'), '/', '_') }}
    displayName: 'Deploy to ${{ parameters.environmentName }}'
    
    jobs:
      - deployment: Deploy
        pool: 
          vmImage: windows-2022
        displayName: 'Deploy'
        environment: ${{ parameters.environmentName }}
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        
        variables:
          # Convention-based variable group: Environment-{EnvironmentName}
          - group: 'Environment-${{ parameters.environmentName }}'
        
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  persistCredentials: true
                  fetchDepth: 1
                  displayName: 'Checkout Source Repository'

                - pwsh: |
                    $ErrorActionPreference = 'Stop'
                    $configPath = Join-Path '$(Pipeline.Workspace)/build/artifacts' 'alm-config.psd1'
                    if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
                      throw "Selected BUILD artifact is missing alm-config.psd1: $configPath"
                    }
                    $config = Import-PowerShellDataFile -LiteralPath $configPath
                    $buildBranch = [string]$env:DEPLOY_BUILD_BRANCH -replace '^refs/heads/', ''
                    if (-not $config.Contains('deployment') -or -not $config.deployment.Contains('branches') -or
                        -not $config.deployment.branches.Contains($buildBranch)) {
                      throw "No deployment environments are configured for branch '$buildBranch'."
                    }
                    $environments = @($config.deployment.branches[$buildBranch] | ForEach-Object { [string]$_ })
                    $targetIndex = [Array]::IndexOf($environments, $env:DEPLOY_TARGET_ENVIRONMENT)
                    if ($targetIndex -lt 0) {
                      throw "Target environment '$env:DEPLOY_TARGET_ENVIRONMENT' is not configured for '$buildBranch'."
                    }
                    $expectedPrevious = if ($targetIndex -gt 0) { [string]$environments[$targetIndex - 1] } else { '' }
                    if ($expectedPrevious -cne $env:DEPLOY_PREVIOUS_ENVIRONMENT) {
                      throw "Previous environment '$env:DEPLOY_PREVIOUS_ENVIRONMENT' does not match configured predecessor '$expectedPrevious'."
                    }
                    if ($targetIndex -gt 0) {
                      $sourceCommit = [string]$env:DEPLOY_BUILD_SOURCE_COMMIT
                      if ($sourceCommit -notmatch '^[0-9a-fA-F]{40}$') {
                        throw "Could not resolve the selected BUILD source commit '$sourceCommit'."
                      }

                      $pointerRef = "refs/tags/deployed/$expectedPrevious"
                      $pointerOutput = @(git ls-remote origin $pointerRef "$pointerRef^{}" 2>&1)
                      if ($LASTEXITCODE -ne 0) {
                        throw "Could not check deployment pointer '$pointerRef': $($pointerOutput -join ' ')"
                      }

                      $pointerRefs = @{}
                      foreach ($line in $pointerOutput) {
                        if ([string]$line -match '^([0-9a-fA-F]{40})\s+(?<ref>.+)$') {
                          $pointerRefs[$Matches['ref']] = $Matches[1]
                        }
                      }
                      $pointerCommit = if ($pointerRefs.ContainsKey("$pointerRef^{}")) {
                        [string]$pointerRefs["$pointerRef^{}"]
                      }
                      else {
                        [string]$pointerRefs[$pointerRef]
                      }
                      if ([string]::IsNullOrWhiteSpace($pointerCommit)) {
                        throw "Previous environment '$expectedPrevious' has no successful deployment pointer."
                      }
                      if ($pointerCommit -ine $sourceCommit) {
                        throw "Previous environment '$expectedPrevious' is not deployed to the selected BUILD source commit '$sourceCommit'."
                      }
                    }
                  displayName: Validate configured deployment stage
                  env:
                    DEPLOY_BUILD_BRANCH: $(resources.pipeline.build.sourceBranch)
                    DEPLOY_BUILD_SOURCE_COMMIT: $(resources.pipeline.build.sourceCommit)
                    DEPLOY_TARGET_ENVIRONMENT: ${{ parameters.environmentName }}
                    DEPLOY_PREVIOUS_ENVIRONMENT: ${{ parameters.previousEnvironmentName }}

                - task: PowerPlatformToolInstaller@2
                  displayName: 'Install Power Platform Tools'
                  inputs:
                    AddToolsToPath: false
                
                - ${{ if eq(parameters.useAlm4DataverseExtension, true) }}:
                  - task: ALM4Dataverse.alm4dataverse-azdo-extensions.alm4dataverse-set-connection-variables.ALM4DataverseSetConnectionVariables@1
                    displayName: 'Set Connection Variables'
                    name: ALM4DataverseSetConnectionVariables
                    inputs:
                      authenticationType: 'PowerPlatformSPN'
                      PowerPlatformSPN: '${{ parameters.environmentName }}'

                - ${{ if ne(parameters.useAlm4DataverseExtension, true) }}:
                  - task: microsoft-IsvExpTools.PowerPlatform-BuildTools.set-connection-variables.PowerPlatformSetConnectionVariables@2
                    displayName: 'Set Connection Variables'
                    name: PowerPlatformSetConnectionVariables
                    inputs:
                      authenticationType: 'PowerPlatformSPN'
                      PowerPlatformSPN: '${{ parameters.environmentName }}'
                
                # Deployment-job artifact download supplies build/artifacts. Execute
                # its bundled ALM scripts, not the current repository's tool version.
                # The credential resolver returns null when no candidate is expanded.
                - pwsh: |
                    & "$(Pipeline.Workspace)/build/artifacts/alm/pipelines/scripts/installdependencies.ps1"
                    $environmentUrl = '$(ALM4DataverseSetConnectionVariables.EnvironmentUrl)'
                    if ([string]::IsNullOrWhiteSpace($environmentUrl) -or $environmentUrl -match '^\$\(.+\)$') {
                      $environmentUrl = '$(BuildTools.EnvironmentUrl)'
                    }
                    if ([string]::IsNullOrWhiteSpace($environmentUrl) -or $environmentUrl -match '^\$\(.+\)$') {
                      throw "Environment URL could not be resolved from the selected connection variables task. Ensure the Power Platform service connection is configured correctly."
                    }

                    $useAlm4DataverseExtension = '${{ parameters.useAlm4DataverseExtension }}' -eq 'true'
                    if (-not $useAlm4DataverseExtension) {
                      function Resolve-ConnectionVariable {
                        param([string[]]$Candidates)

                        foreach ($candidate in $Candidates) {
                          if (-not [string]::IsNullOrWhiteSpace($candidate) -and $candidate -notmatch '^\$\(.+\)$') {
                            return $candidate
                          }
                        }

                        return $null
                      }

                      $resolvedClientId = Resolve-ConnectionVariable @(
                        $env:AZURE_CLIENT_ID
                        '$(PowerPlatformSetConnectionVariables.BuildTools.ApplicationId)'
                        '$(BuildTools.ApplicationId)'
                      )
                      $resolvedTenantId = Resolve-ConnectionVariable @(
                        $env:AZURE_TENANT_ID
                        '$(PowerPlatformSetConnectionVariables.BuildTools.TenantId)'
                        '$(BuildTools.TenantId)'
                      )
                      $resolvedClientSecret = Resolve-ConnectionVariable @(
                        $env:AZURE_CLIENT_SECRET
                        '$(PowerPlatformSetConnectionVariables.BuildTools.ClientSecret)'
                        '$(BuildTools.ClientSecret)'
                      )

                      if ([string]::IsNullOrWhiteSpace($resolvedClientId) -or [string]::IsNullOrWhiteSpace($resolvedTenantId) -or [string]::IsNullOrWhiteSpace($resolvedClientSecret)) {
                        throw "Service principal credentials could not be resolved from Set Connection Variables task outputs. Verify the Power Platform service connection and task output variable names."
                      }

                      $env:AZURE_CLIENT_ID = $resolvedClientId
                      $env:AZURE_TENANT_ID = $resolvedTenantId
                      $env:AZURE_CLIENT_SECRET = $resolvedClientSecret
                    }

                    & "$(Pipeline.Workspace)/build/artifacts/alm/pipelines/scripts/connect.ps1" -Url $environmentUrl
                    
                    # Run the deployment script FROM THE ARTIFACTS
                    # This ensures the script version matches the solution version being deployed
                    & "$(Pipeline.Workspace)/build/artifacts/alm/pipelines/scripts/deploy.ps1" `
                      -ArtifactsPath "$(Pipeline.Workspace)/build/artifacts"
                  displayName: 'Connect and Run Deployment Script from Artifacts'
                  workingDirectory: '$(Pipeline.Workspace)/build/artifacts'
                  env:
                    ${{ if eq(parameters.useAlm4DataverseExtension, true) }}:
                      AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
                    ${{ if ne(parameters.useAlm4DataverseExtension, true) }}:
                      AZURE_CLIENT_ID: $(PowerPlatformSetConnectionVariables.BuildTools.ApplicationId)
                      AZURE_TENANT_ID: $(PowerPlatformSetConnectionVariables.BuildTools.TenantId)
                      AZURE_CLIENT_SECRET: $(PowerPlatformSetConnectionVariables.BuildTools.ClientSecret)

                # Move the environment pointer only after deployment succeeds.
                # Metadata binds the selected run to its source; older artifacts
                # without metadata retain the sanitized run-name tag fallback.
                # ConvertTo-TagSegment is that legacy fallback, not a SemVer parser.
                - pwsh: |
                    $ErrorActionPreference = 'Stop'

                    function ConvertTo-TagSegment {
                      param([Parameter(Mandatory)][string]$Value)

                      $sanitized = $Value `
                        -replace '[^a-zA-Z0-9._/-]', '-' `
                        -replace '\.{2,}', '-' `
                        -replace '/{2,}', '/'
                      $sanitized = $sanitized.Trim('/', '.')
                      if ($sanitized.EndsWith('.lock')) {
                        $sanitized = $sanitized -replace '\.lock$', '-lock'
                      }
                      if ([string]::IsNullOrWhiteSpace($sanitized)) {
                        throw "Value '$Value' cannot be converted to a valid git tag segment"
                      }

                      return $sanitized
                    }

                    $rawBuildRunName = '$(resources.pipeline.build.runName)'
                    $buildRunId = '$(resources.pipeline.build.runID)'
                    $metadataPath = Join-Path '$(Pipeline.Workspace)/build/artifacts' 'build-version.json'
                    $metadata = $null
                    if (Test-Path -LiteralPath $metadataPath -PathType Leaf) {
                      $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
                      if ($metadata.provider -cne 'azdo' -or
                          $metadata.runId -cne $buildRunId -or
                          $metadata.sourceCommit -ine '$(resources.pipeline.build.sourceCommit)' -or
                          $metadata.tag -cne "v$($metadata.version)") {
                        throw "BUILD version metadata does not match selected BUILD run '$buildRunId'."
                      }
                      $versionTag = [string]$metadata.tag
                    }
                    else {
                      $sanitizedBuildRunName = ConvertTo-TagSegment -Value $rawBuildRunName
                      $versionTag = $sanitizedBuildRunName
                    }
                    $environmentTag = 'deployed/${{ parameters.environmentName }}'
                    if ($buildRunId -notmatch '^\d+$') {
                      throw "Could not resolve the Azure DevOps BUILD run ID '$buildRunId'."
                    }

                    Write-Host "Fetching build version tag '$versionTag' from origin"
                    git fetch --force origin "refs/tags/${versionTag}:refs/tags/${versionTag}"
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to fetch build version tag '$versionTag' from origin"
                    }

                    $targetCommit = (git rev-list -n 1 "$versionTag").Trim()
                    if ([string]::IsNullOrWhiteSpace($targetCommit)) {
                      throw "Could not resolve a commit SHA from build version tag '$versionTag'"
                    }
                    if ($null -ne $metadata -and $targetCommit -ine [string]$metadata.sourceCommit) {
                      throw "BUILD version tag '$versionTag' resolves to '$targetCommit', not the source commit recorded in build metadata '$($metadata.sourceCommit)'."
                    }

                    Write-Host "Updating environment pointer tag '$environmentTag' to BUILD run $buildRunId ($targetCommit)"
                    $pointerMessage = @(
                      'ALM4Dataverse environment deployment pointer'
                      "Build: $rawBuildRunName"
                      "BUILD run: $buildRunId"
                      "Source commit: $targetCommit"
                    ) -join "`n"
                    git tag -f -a "$environmentTag" -m "$pointerMessage" "$targetCommit"
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to create or move environment tag '$environmentTag'"
                    }

                    git push origin "refs/tags/$environmentTag" --force
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to push environment tag '$environmentTag'"
                    }

                    Write-Host "Environment pointer tag '$environmentTag' now points to build '$versionTag' ($targetCommit)."
                  displayName: 'Update Environment Deployment Tag'
                  workingDirectory: '$(Build.SourcesDirectory)'

                - ${{ if eq(parameters.continueDeployment, true) }}:
                  - pwsh: |
                      & "$(Pipeline.Workspace)/build/artifacts/alm/pipelines/scripts/continue-deployment.ps1" `
                        -ArtifactsPath "$(Pipeline.Workspace)/build/artifacts" `
                        -TargetEnvironment $env:DEPLOY_TARGET_ENVIRONMENT `
                        -PreviousEnvironmentName $env:DEPLOY_PREVIOUS_ENVIRONMENT
                    displayName: 'Queue next configured deployment'
                    env:
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                      DEPLOY_BUILD_SOURCE_BRANCH: $(resources.pipeline.build.sourceBranch)
                      DEPLOY_BUILD_RUN_NAME: $(resources.pipeline.build.runName)
                      DEPLOY_TARGET_ENVIRONMENT: ${{ parameters.environmentName }}
                      DEPLOY_PREVIOUS_ENVIRONMENT: ${{ parameters.previousEnvironmentName }}
